name: Android APK

# 1. build: type check, unit tests, test APK (release build signed with the debug key,
#    for testing only, not for the Play Store), published as a pre-release.
# 2. e2e: installs that APK on an Android emulator and runs tests/e2e/flows/main.yaml.
# Screenshots and logs from both jobs are pushed to the ci-results-* branches.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          mkdir -p build-results
          npm run typecheck 2>&1 | tee build-results/typecheck.txt
          npm run lint 2>&1 | tee build-results/lint.txt
          npm test 2>&1 | tee build-results/unit-tests.txt

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        # arm64-v8a covers current phones, x86_64 covers the Android emulator.
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon 2>&1 | tee ../build-results/gradle.txt

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/voice-clarity-${GITHUB_SHA::7}.apk"
          ls -la out > build-results/apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voice-clarity-apk
          path: out/*.apk
          retention-days: 30

      # A pre-release per build gives a direct .apk link you can open on the phone.
      - name: Publish test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Test APK built from ${{ github.sha }}. Signed with the Android debug key: for testing only, not for the Play Store.
            Install: open the .apk on your phone and allow "Install unknown apps" for your browser or file manager.
          files: out/*.apk

      - name: Publish build results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-results
          if [ -f build-results/gradle.txt ]; then tail -n 400 build-results/gradle.txt > build-results/gradle-tail.txt; grep -nE "^e: |error:|FAILURE|What went wrong" -A5 build-results/gradle.txt > build-results/gradle-errors.txt || true; rm build-results/gradle.txt; fi
          echo "${{ job.status }}" > build-results/STATUS
          bash tests/e2e/publish-results.sh build-results ci-results-build

  e2e:
    needs: build
    # Pinned: the emulator action documents ubuntu-24.04 + KVM; ubuntu-latest is moving to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: voice-clarity-apk
          path: apk

      # Generated with tests/e2e/make-audio.sh and committed, so no apt installs are needed here.
      - name: Test recordings
        run: |
          mkdir -p e2e-audio results
          cp tests/e2e/audio/* e2e-audio/
          { ls -l /dev/kvm; nproc; free -m; } > results/runner.txt 2>&1 || true

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 1200
          script: bash tests/e2e/run-on-emulator.sh

      - name: Publish e2e results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          bash tests/e2e/publish-results.sh results ci-results-e2e
