name: Android APK

# Builds an installable test APK (release build, signed with the Android debug key).
# Not for the Play Store: that needs your own upload key.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        # arm64-v8a covers current phones, x86_64 covers the Android emulator.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/voice-clarity-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: voice-clarity-apk
          path: out/*.apk
          retention-days: 30

      # A pre-release per build gives a direct .apk link you can open on the phone.
      - name: Publish test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Test APK built from ${{ github.sha }}. Signed with the Android debug key: for testing only, not for the Play Store.
            Install: open the .apk on your phone and allow "Install unknown apps" for your browser or file manager.
          files: out/*.apk
