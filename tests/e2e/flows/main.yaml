# End-to-end test on an Android emulator. Screenshots go to the results folder.
appId: com.example.voiceclarity
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "OK"
    timeout: 60000
- takeScreenshot: 01_first_run_privacy
- tapOn: "OK"
- assertVisible: ".*No recordings yet.*"
- takeScreenshot: 02_library_empty

# ---- Import the noisy Arabic M4A ----
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: arabic_noisy.m4a
      SHOT: "03"
- extendedWaitUntil:
    visible: ".*arabic_noisy.*Ready.*"
    timeout: 120000
- takeScreenshot: 04_library_imported
- tapOn:
    id: "rec-arabic_noisy"
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 30000
- takeScreenshot: 05_player

# ---- Playback ----
- tapOn:
    id: "play-pause"
# the elapsed-time label leaves 0:00 once playback is running
- extendedWaitUntil:
    notVisible: "0:00"
    timeout: 15000
- tapOn:
    id: "play-pause"
- takeScreenshot: 06_played_then_paused
# back to 0, then: next speech (first section starts at ~1.4 s), +10, -10 -> back at 0:01
- tapOn:
    id: "back-10"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:00"
- tapOn:
    id: "next-speech"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:11"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- takeScreenshot: 07_after_seek
# jumping past the end stops just before it and a jump back still works
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:20"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:10"
- takeScreenshot: 07b_back_from_end

# ---- Bookmarks ----
- tapOn:
    id: "add-bookmark"
- assertVisible: "Added Bookmark 1 at .*"
- scrollUntilVisible:
    element: "Bookmark 1"
- tapOn:
    id: "edit-bm-Bookmark 1"
- tapOn:
    id: "bm-label"
- eraseText: 30
- inputText: "Intro"
- tapOn:
    id: "bm-save"
- assertVisible: "Intro"
- takeScreenshot: 08_bookmark_renamed

# ---- Speed and skip silence ----
- scrollUntilVisible:
    element:
      id: "speed-1.5"
    direction: UP
- tapOn:
    id: "speed-5"
- assertVisible:
    id: "speed-5"
    checked: true
# the rate label sits above the chips; scrolling to it proves the player took 5×
- scrollUntilVisible:
    element: "5.00×"
    direction: UP
- scrollUntilVisible:
    element:
      id: "speed-1.5"
    direction: DOWN
- tapOn:
    id: "speed-1.5"
- tapOn:
    id: "skip-silence"
- takeScreenshot: 09_speed_skip

# ---- Auto Enhance ----
- scrollUntilVisible:
    element:
      id: "auto-enhance"
- tapOn:
    id: "auto-enhance"
- extendedWaitUntil:
    visible: ".*These settings will be used.*|.*Strength.*"
    timeout: 15000
- takeScreenshot: 10_enhance_setup
- scrollUntilVisible:
    element:
      id: "start-enhance"
- takeScreenshot: 11_enhance_summary
- tapOn:
    id: "start-enhance"
- takeScreenshot: 12_enhance_running
- extendedWaitUntil:
    visible:
      id: "ab-original"
    timeout: 600000
- assertVisible:
    id: "keep-enhanced"
- takeScreenshot: 13_review_top
- tapOn:
    id: "ab-original"
- tapOn:
    id: "review-play"
- tapOn:
    id: "ab-enhanced"
- tapOn:
    id: "review-play"
- scrollUntilVisible:
    element: "Mains hum found at 50 Hz"
- takeScreenshot: 14_review_levels
- tapOn:
    id: "keep-enhanced"
- extendedWaitUntil:
    visible:
      id: "source-enhanced"
    timeout: 20000
- takeScreenshot: 15_player_enhanced
- tapOn:
    id: "source-original"
- tapOn:
    id: "source-enhanced"

# ---- Transcription (Arabic, base model) ----
- scrollUntilVisible:
    element:
      id: "transcript"
- tapOn:
    id: "transcript"
- extendedWaitUntil:
    visible:
      id: "lang-ar"
    timeout: 15000
- tapOn:
    id: "lang-ar"
- tapOn:
    id: "model-base"
- takeScreenshot: 16_transcript_setup
- scrollUntilVisible:
    element: ".*(Download \\(148 MB\\)|On device).*"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "download-model"
    commands:
      - tapOn:
          id: "download-model"
- extendedWaitUntil:
    visible: ".*On device.*"
    timeout: 900000
- scrollUntilVisible:
    element:
      id: "start-transcribe"
- tapOn:
    id: "start-transcribe"
- takeScreenshot: 17_transcribing
- extendedWaitUntil:
    visible:
      id: "seg-s0"
    timeout: 1200000
- takeScreenshot: 18_transcript
- tapOn:
    id: "seg-s0"
- tapOn:
    id: "search"
- inputText: "x"
- takeScreenshot: 19_search
- eraseText: 5
- back
- back

# ---- Export sheet ----
- scrollUntilVisible:
    element:
      id: "export"
- tapOn:
    id: "export"
- takeScreenshot: 20_export_sheet
- tapOn: "Close"

# ---- Edit: trim 0.5-10 s, speed 1.5x, preview, Save as a new recording ----
- scrollUntilVisible:
    element:
      id: "edit-audio"
- tapOn:
    id: "edit-audio"
- extendedWaitUntil:
    visible:
      id: "trim-mode-keep"
    timeout: 15000
- tapOn:
    id: "edit-fwd-10"
- extendedWaitUntil:
    visible: "0:10.0 / .*"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "play-selection"
- tapOn:
    id: "set-end"
- assertVisible:
    id: "sel-end-value"
    text: "0:10.0"
- tapOn:
    id: "start-plus"
- tapOn:
    id: "start-plus"
- tapOn:
    id: "start-plus"
- tapOn:
    id: "start-plus"
- tapOn:
    id: "start-plus"
- assertVisible:
    id: "sel-start-value"
    text: "0:00.5"
- scrollUntilVisible:
    element:
      id: "edit-speed-1.5"
- tapOn:
    id: "edit-speed-1.5"
- scrollUntilVisible:
    element:
      id: "edit-save-as"
- assertVisible: "New length: 0:06.*"
- assertVisible: "Saved as M4A, the same type as the original."
- takeScreenshot: 30_edit_setup
- scrollUntilVisible:
    element:
      id: "edit-preview"
- tapOn:
    id: "edit-preview"
# the buttons come back below the fold when rendering ends; scroll while waiting
- scrollUntilVisible:
    element:
      id: "edit-save-as"
    timeout: 180000
- scrollUntilVisible:
    element:
      id: "edit-listen-preview"
    direction: UP
- takeScreenshot: 31_edit_preview
- scrollUntilVisible:
    element:
      id: "edit-save-as"
- scrollUntilVisible:
    element:
      id: "edit-save-as"
- tapOn:
    id: "edit-save-as"
- assertVisible: "arabic_noisy-v1"
- takeScreenshot: 31b_save_as_default_name
- tapOn:
    id: "save-as-confirm"
- extendedWaitUntil:
    visible: "arabic_noisy-v1"
    timeout: 120000
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 120000
- assertVisible: ".*0:06.*"
- assertVisible: "M4A"
- takeScreenshot: 32_saved_as_player
- back

# ---- Whispers: detection, Smart settings, audibility ----
- back
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: whisper_mix.m4a
      SHOT: "40"
- extendedWaitUntil:
    visible: ".*whisper_mix.*Ready.*"
    timeout: 120000
- tapOn:
    id: "rec-whisper_mix"
- extendedWaitUntil:
    visible: "4 speech sections"
    timeout: 30000
- scrollUntilVisible:
    element: ".*· whisper"
- takeScreenshot: 41_whisper_sections
- scrollUntilVisible:
    element:
      id: "auto-enhance"
    direction: UP
- tapOn:
    id: "auto-enhance"
- assertVisible:
    id: "auto-hint"
- scrollUntilVisible:
    element:
      id: "start-enhance"
- tapOn:
    id: "start-enhance"
- extendedWaitUntil:
    visible:
      id: "ab-original"
    timeout: 600000
- scrollUntilVisible:
    element:
      id: "reason-auto_whisper_protect"
- assertVisible:
    id: "reason-auto_level_on"
- takeScreenshot: 42_whisper_smart_reasons
- scrollUntilVisible:
    element: "Whispered or distant sections"
- takeScreenshot: 43_whisper_levels
- tapOn:
    id: "keep-enhanced"
- extendedWaitUntil:
    visible:
      id: "source-enhanced"
    timeout: 20000
- back

# ---- Back in the library: stereo MP3 and a broken file ----
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: english_stereo.mp3
      SHOT: "21"
- extendedWaitUntil:
    visible: ".*english_stereo.*Ready.*"
    timeout: 120000

# ---- Edit with Save (replace): stereo MP3 at 1.25x becomes a WAV ----
- tapOn:
    id: "rec-english_stereo"
- scrollUntilVisible:
    element:
      id: "edit-audio"
- tapOn:
    id: "edit-audio"
- scrollUntilVisible:
    element:
      id: "trim-mode-none"
- tapOn:
    id: "trim-mode-none"
- scrollUntilVisible:
    element:
      id: "edit-speed-1.25"
- tapOn:
    id: "edit-speed-1.25"
- scrollUntilVisible:
    element:
      id: "edit-save"
- assertVisible: "This phone cannot write MP3 files, so the edit is saved as M4A."
- tapOn:
    id: "edit-save"
- takeScreenshot: 33_replace_confirm
- tapOn: "Replace"
- extendedWaitUntil:
    visible: "M4A"
    timeout: 120000
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 120000
- takeScreenshot: 34_replaced_player
- back
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: broken.m4a
      SHOT: "22"
- extendedWaitUntil:
    visible: ".*broken.*(Needs attention|Ready).*"
    timeout: 120000
- assertVisible: ".*arabic_noisy-v1.*Ready.*"
- takeScreenshot: 23_library_four_files

# ---- Play list from a folder: filters, play, next file ----
- tapOn:
    id: "open-playlist"
- tapOn:
    id: "pl-pick"
- runFlow:
    file: pick-folder.yaml
- extendedWaitUntil:
    visible: "3 of 3 audio files match"
    timeout: 20000
- assertVisible: ".*Music/vc-playlist"
- assertNotVisible: "notes.txt"
- takeScreenshot: 52_playlist
- tapOn:
    id: "pl-ext"
- inputText: "m4a"
- hideKeyboard
- assertVisible: "2 of 3 audio files match"
- tapOn:
    id: "pl-name"
- inputText: "whisper"
- hideKeyboard
- assertVisible: "1 of 3 audio files match"
- takeScreenshot: 53_playlist_filtered
- eraseText:
    charactersToErase: 20
- hideKeyboard
- tapOn:
    id: "pl-ext"
- eraseText:
    charactersToErase: 10
- hideKeyboard
- assertVisible: "3 of 3 audio files match"
- tapOn:
    id: "pl-sort-oldest"
- tapOn:
    id: "pl-sort-name"
- scrollUntilVisible:
    element:
      id: "pl-item-arabic_noisy.m4a"
- tapOn:
    id: "pl-item-arabic_noisy.m4a"
- extendedWaitUntil:
    visible: "File 1 of 3"
    timeout: 30000
# played in place from the folder, and speech is found without copying the file
- assertVisible:
    id: "in-folder"
- extendedWaitUntil:
    visible: "[1-9][0-9]* speech sections?"
    timeout: 30000
# it starts playing on its own
- extendedWaitUntil:
    notVisible:
      id: "elapsed"
      text: "0:00"
    timeout: 15000
- takeScreenshot: 54_playlist_player
- tapOn:
    id: "pl-next"
- extendedWaitUntil:
    visible: "File 2 of 3"
    timeout: 30000
- assertVisible: "english_stereo"
- tapOn:
    id: "play-pause"
- takeScreenshot: 55_playlist_next
# Save on a folder file: an MP3 cannot be written, so it becomes english_stereo.m4a in the folder
- scrollUntilVisible:
    element:
      id: "edit-audio"
- tapOn:
    id: "edit-audio"
- scrollUntilVisible:
    element:
      id: "edit-speed-1.25"
- tapOn:
    id: "edit-speed-1.25"
- scrollUntilVisible:
    element:
      id: "edit-save"
- tapOn:
    id: "edit-save"
- assertVisible: ".*saved in the same folder as “english_stereo.m4a”.*"
- takeScreenshot: 56_folder_save_confirm
- tapOn: "Replace"
- extendedWaitUntil:
    visible: "M4A"
    timeout: 120000
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 120000
- assertVisible:
    id: "in-folder"
- takeScreenshot: 57_folder_saved_player
- back
- extendedWaitUntil:
    visible: "3 of 3 audio files match"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "pl-item-english_stereo.m4a"
- assertNotVisible:
    id: "pl-item-english_stereo.mp3"
- takeScreenshot: 58_folder_after_save
# delete a file from the folder from its play-list row
- scrollUntilVisible:
    element:
      id: "pl-del-whisper_mix.m4a"
- tapOn:
    id: "pl-del-whisper_mix.m4a"
- assertVisible: ".*Delete “whisper_mix.m4a” from the folder.*"
- takeScreenshot: 59_folder_delete_confirm
- tapOn:
    id: "android:id/button1"
- extendedWaitUntil:
    visible: "2 of 2 audio files match"
    timeout: 20000
- assertNotVisible:
    id: "pl-item-whisper_mix.m4a"
- back

# ---- Arabic interface ----
- tapOn:
    id: "open-settings"
- scrollUntilVisible:
    element:
      id: "skip-back-custom"
- tapOn:
    id: "skip-back-custom"
- inputText: "1:30"
- tapOn:
    id: "skip-back-apply"
- assertVisible:
    id: "skip-back-value"
    text: "1 min 30 s"
- takeScreenshot: 44_skip_custom
- scrollUntilVisible:
    element:
      id: "ui-lang-ar"
    direction: UP
- tapOn:
    id: "ui-lang-ar"
- takeScreenshot: 24_rtl_prompt
- tapOn:
    text: "حسناً|OK"
    optional: true
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*التسجيلات.*"
    timeout: 30000
- takeScreenshot: 25_library_arabic_rtl
- tapOn:
    id: "rec-arabic_noisy"
- takeScreenshot: 26_player_arabic_rtl
