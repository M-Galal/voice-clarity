# End-to-end test on an Android emulator. Screenshots go to the results folder.
appId: com.example.voiceclarity
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "OK"
    timeout: 60000
- takeScreenshot: 01_first_run_privacy
- tapOn: "OK"
- assertVisible: ".*No recordings yet.*"
- takeScreenshot: 02_library_empty

# ---- Import the noisy Arabic M4A ----
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: arabic_noisy.m4a
      SHOT: "03"
- extendedWaitUntil:
    visible: ".*arabic_noisy.*Ready.*"
    timeout: 120000
- takeScreenshot: 04_library_imported
- tapOn:
    id: "rec-arabic_noisy"
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 30000
- takeScreenshot: 05_player

# ---- Playback ----
- tapOn:
    id: "play-pause"
# the elapsed-time label leaves 0:00 once playback is running
- extendedWaitUntil:
    notVisible: "0:00"
    timeout: 15000
- tapOn:
    id: "play-pause"
- takeScreenshot: 06_played_then_paused
# back to 0, then: next speech (first section starts at ~1.4 s), +10, -10 -> back at 0:01
- tapOn:
    id: "back-10"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:00"
- tapOn:
    id: "next-speech"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:11"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- takeScreenshot: 07_after_seek
# jumping past the end stops just before it and a jump back still works
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:20"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:10"
- takeScreenshot: 07b_back_from_end

# ---- Bookmarks ----
- tapOn:
    id: "add-bookmark"
- assertVisible: "Added Bookmark 1 at .*"
- scrollUntilVisible:
    element: "Bookmark 1"
- tapOn:
    id: "edit-bm-Bookmark 1"
- tapOn:
    id: "bm-label"
- eraseText: 30
- inputText: "Intro"
- tapOn:
    id: "bm-save"
- assertVisible: "Intro"
- takeScreenshot: 08_bookmark_renamed

# ---- Jump to a time, A-B repeat ----
# (the bookmark list is below the jump and repeat card)
- scrollUntilVisible:
    element:
      id: "jump-input"
    direction: UP
    centerElement: true
- tapOn:
    id: "jump-input"
- inputText: "0:05"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "elapsed"
    direction: UP
- assertVisible:
    id: "elapsed"
    text: "0:05"
- scrollUntilVisible:
    element:
      id: "rep-a"
    centerElement: true
- tapOn:
    id: "rep-a"
- inputText: "0:02"
- pressKey: Enter
- tapOn:
    id: "rep-b"
- eraseText: 10
- inputText: "0:04"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "rep-on"
- tapOn:
    id: "rep-times-0"
- tapOn:
    id: "rep-on"
- assertVisible:
    id: "rep-progress"
    text: "Pass 1"
- takeScreenshot: 08b_repeat_set
- scrollUntilVisible:
    element:
      id: "play-pause"
    direction: UP
- tapOn:
    id: "play-pause"
- scrollUntilVisible:
    element:
      id: "rep-progress"
# the 2 s part has been played again at least once
- extendedWaitUntil:
    visible:
      id: "rep-progress"
      text: "Pass [2-9]"
    timeout: 20000
- takeScreenshot: 08c_repeating
- tapOn:
    id: "rep-on"
- scrollUntilVisible:
    element:
      id: "play-pause"
    direction: UP
- tapOn:
    id: "play-pause"

# ---- Speed and skip silence ----
- scrollUntilVisible:
    element:
      id: "speed-slider-track"
    direction: UP
    centerElement: true
# drag the speed slider all the way right: 5×
- swipe:
    from:
      id: "speed-slider-track"
    direction: RIGHT
# the swipe ends near the right edge: 4.5× or more (the last run landed on 4.95×)
- assertVisible:
    id: "speed-slider-value"
    text: "(4\\.[5-9][0-9]|5\\.00)×"
- tapOn:
    id: "speed-reset"
- assertVisible:
    id: "speed-slider-value"
    text: "1.00×"
- tapOn:
    id: "skip-silence"
- takeScreenshot: 09_speed_skip

# ---- Auto Enhance ----
- scrollUntilVisible:
    element:
      id: "auto-enhance"
- tapOn:
    id: "auto-enhance"
- extendedWaitUntil:
    visible: ".*These settings will be used.*|.*Strength.*"
    timeout: 15000
# Smart mode analyses the whole recording as soon as the screen opens
# (the docked live panel shows when the Smart settings are in; the result card itself may be
# below the fold)
- extendedWaitUntil:
    visible:
      id: "pv-settled"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "smart-auto_sections"
    centerElement: true
- scrollUntilVisible:
    element:
      id: "per-section"
- scrollUntilVisible:
    element:
      id: "steady-noise"
- takeScreenshot: 10_enhance_setup
# live listening: play with the Smart settings, switch original/enhanced, change a setting while playing
- scrollUntilVisible:
    element:
      id: "pv-summary"
    timeout: 120000
- tapOn:
    id: "pv-play"
# the live panel is docked at the bottom; its details hold the spectrum
- tapOn:
    id: "pv-details"
- extendedWaitUntil:
    visible:
      id: "pv-spectrum"
    timeout: 20000
- takeScreenshot: 10a_live_details
- tapOn:
    id: "pv-details"
- tapOn:
    id: "pv-ab-original"
- tapOn:
    id: "pv-ab-enhanced"
# listening speed while playing: all the way right (about 5x), then back to 1x
- swipe:
    from:
      id: "pv-speed-track"
    direction: RIGHT
- assertVisible:
    id: "pv-speed-value"
    text: "(4\\.[5-9][0-9]|5\\.00)×"
- takeScreenshot: 10b2_live_fast
- tapOn:
    id: "pv-speed-reset"
- assertVisible:
    id: "pv-speed-value"
    text: "1.00×"
- takeScreenshot: 10b_live
# jump and A-B repeat from the live panel (the part set in the player is kept with the recording)
- tapOn:
    id: "pv-tools"
- tapOn:
    id: "pv-jump-input"
- inputText: "0:03"
- pressKey: Enter
- assertVisible:
    id: "pv-range"
    text: "0:0[3-6] / .*"
- tapOn:
    id: "pv-tools"
- scrollUntilVisible:
    element:
      id: "pv-rep-on"
- tapOn:
    id: "pv-rep-on"
- scrollUntilVisible:
    element:
      id: "pv-tools-close"
- tapOn:
    id: "pv-tools-close"
# playback reached the end of this 20 s recording during the steps above: play again
- tapOn:
    id: "pv-play"
- extendedWaitUntil:
    visible:
      id: "pv-rep-status"
      text: ".*0:02-0:04.*Pass [2-9].*"
    timeout: 25000
- takeScreenshot: 10b3_live_repeat
- tapOn:
    id: "pv-play"
- tapOn:
    id: "pv-tools"
- scrollUntilVisible:
    element:
      id: "pv-rep-on"
- tapOn:
    id: "pv-rep-on"
- scrollUntilVisible:
    element:
      id: "pv-tools-close"
- tapOn:
    id: "pv-tools-close"
- repeat:
    while:
      notVisible:
        id: "pv-sections"
    times: 10
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 70%
          duration: 400
- takeScreenshot: 10d_live_sections
# Swipe near the left edge: a swipe through the middle lands on a slider and moves it
# instead of scrolling the page.
- repeat:
    while:
      notVisible:
        id: "strength-strong"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
- tapOn:
    id: "strength-strong"
- scrollUntilVisible:
    element:
      id: "pv-summary"
    timeout: 20000
- takeScreenshot: 10c_live_strong
- tapOn:
    id: "pv-play"
- repeat:
    while:
      notVisible:
        id: "strength-auto"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
# one-tap preset for a kind of recording: shows what it does and the sliders with its values
- scrollUntilVisible:
    element:
      id: "situation-whisper"
- tapOn:
    id: "situation-whisper"
- scrollUntilVisible:
    element:
      id: "situation-hint"
- takeScreenshot: 10e_situation_whisper
- repeat:
    while:
      notVisible:
        id: "strength-auto"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
- tapOn:
    id: "strength-auto"
# equaliser: raise 3 kHz (consonants) on top of the Smart settings; the saved file uses it too
- scrollUntilVisible:
    element:
      id: "eq-open"
- tapOn:
    id: "eq-open"
- scrollUntilVisible:
    element:
      id: "eq-flat"
- swipe:
    from:
      id: "eq-3000-track"
    direction: RIGHT
- assertVisible:
    id: "eq-3000-value"
    text: "\\+1[0-2].*dB"
- takeScreenshot: 10f_equaliser
# the bands pushed the Adjust/Hide button above the screen; swipe along the left edge so no
# band slider is moved
- repeat:
    while:
      notVisible:
        id: "eq-open"
    times: 10
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 60%
          duration: 400
- tapOn:
    id: "eq-open"
- repeat:
    while:
      notVisible:
        id: "start-enhance"
    times: 20
    commands:
      - swipe:
          start: 4%, 65%
          end: 4%, 20%
          duration: 400
- assertVisible: "(?s).*Equaliser: 3k \\+1[0-2] dB.*"
- takeScreenshot: 11_enhance_summary
- tapOn:
    id: "start-enhance"
- takeScreenshot: 12_enhance_running
- extendedWaitUntil:
    visible:
      id: "ab-original"
    timeout: 600000
- assertVisible:
    id: "keep-enhanced"
- takeScreenshot: 13_review_top
- tapOn:
    id: "ab-original"
- tapOn:
    id: "review-play"
- tapOn:
    id: "ab-enhanced"
- tapOn:
    id: "review-play"
- scrollUntilVisible:
    element: "Mains hum found at 50 Hz"
- takeScreenshot: 14_review_levels
- tapOn:
    id: "keep-enhanced"
- extendedWaitUntil:
    visible:
      id: "source-enhanced"
    timeout: 20000
- takeScreenshot: 15_player_enhanced
- tapOn:
    id: "source-original"
- tapOn:
    id: "source-enhanced"
