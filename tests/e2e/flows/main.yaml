# End-to-end test on an Android emulator. Screenshots go to the results folder.
appId: com.example.voiceclarity
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "OK"
    timeout: 60000
- takeScreenshot: 01_first_run_privacy
- tapOn: "OK"
- assertVisible: ".*No recordings yet.*"
- takeScreenshot: 02_library_empty

# ---- Import the noisy Arabic M4A ----
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: arabic_noisy.m4a
      SHOT: "03"
- extendedWaitUntil:
    visible: ".*arabic_noisy.*Ready.*"
    timeout: 120000
- takeScreenshot: 04_library_imported
- tapOn:
    id: "rec-arabic_noisy"
- extendedWaitUntil:
    visible: ".*[1-9] speech sections.*"
    timeout: 30000
- takeScreenshot: 05_player

# ---- Playback ----
- tapOn:
    id: "play-pause"
# the elapsed-time label leaves 0:00 once playback is running
- extendedWaitUntil:
    notVisible: "0:00"
    timeout: 15000
- tapOn:
    id: "play-pause"
- takeScreenshot: 06_played_then_paused
# back to 0, then: next speech (first section starts at ~1.4 s), +10, -10 -> back at 0:01
- tapOn:
    id: "back-10"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:00"
- tapOn:
    id: "next-speech"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:11"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:01"
- takeScreenshot: 07_after_seek
# jumping past the end stops just before it and a jump back still works
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- tapOn:
    id: "fwd-10"
- assertVisible:
    id: "elapsed"
    text: "0:20"
- tapOn:
    id: "back-10"
- assertVisible:
    id: "elapsed"
    text: "0:10"
- takeScreenshot: 07b_back_from_end

# ---- Bookmarks ----
- tapOn:
    id: "add-bookmark"
- assertVisible: "Added Bookmark 1 at .*"
- scrollUntilVisible:
    element: "Bookmark 1"
- tapOn:
    id: "edit-bm-Bookmark 1"
- tapOn:
    id: "bm-label"
- eraseText: 30
- inputText: "Intro"
- tapOn:
    id: "bm-save"
- assertVisible: "Intro"
- takeScreenshot: 08_bookmark_renamed

# ---- Speed and skip silence ----
- scrollUntilVisible:
    element:
      id: "speed-slider-track"
    direction: UP
    centerElement: true
# drag the speed slider all the way right: 5×
- swipe:
    from:
      id: "speed-slider-track"
    direction: RIGHT
# the swipe ends near the right edge: 4.5× or more (the last run landed on 4.95×)
- assertVisible:
    id: "speed-slider-value"
    text: "(4\\.[5-9][0-9]|5\\.00)×"
- tapOn:
    id: "speed-reset"
- assertVisible:
    id: "speed-slider-value"
    text: "1.00×"
- tapOn:
    id: "skip-silence"
- takeScreenshot: 09_speed_skip

# ---- Auto Enhance ----
- scrollUntilVisible:
    element:
      id: "auto-enhance"
- tapOn:
    id: "auto-enhance"
- extendedWaitUntil:
    visible: ".*These settings will be used.*|.*Strength.*"
    timeout: 15000
# Smart mode analyses the whole recording as soon as the screen opens
- extendedWaitUntil:
    visible:
      id: "smart-ready"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "smart-auto_sections"
    centerElement: true
- scrollUntilVisible:
    element:
      id: "per-section"
- takeScreenshot: 10_enhance_setup
# preview 15 s with the current (Smart) settings, compare, then change a setting: it re-renders
- scrollUntilVisible:
    element:
      id: "pv-render"
- tapOn:
    id: "pv-render"
# the result line appears below the buttons: scroll while waiting for it
- scrollUntilVisible:
    element:
      id: "pv-summary"
    timeout: 120000
- tapOn:
    id: "pv-play"
- tapOn:
    id: "pv-ab-original"
- tapOn:
    id: "pv-ab-enhanced"
- scrollUntilVisible:
    element:
      id: "pv-spectrum"
- scrollUntilVisible:
    element:
      id: "pv-section-list"
- takeScreenshot: 10b_preview
- repeat:
    while:
      notVisible:
        id: "pv-sections"
    times: 10
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 70%
          duration: 400
- takeScreenshot: 10d_preview_sections
# Swipe near the left edge: a swipe through the middle lands on a slider and moves it
# instead of scrolling the page.
- repeat:
    while:
      notVisible:
        id: "strength-strong"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
- tapOn:
    id: "strength-strong"
- scrollUntilVisible:
    element:
      id: "pv-summary"
    timeout: 60000
- tapOn:
    id: "pv-play"
    optional: true
- takeScreenshot: 10c_preview_strong
- repeat:
    while:
      notVisible:
        id: "strength-auto"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
# one-tap preset for a kind of recording: shows what it does and the sliders with its values
- scrollUntilVisible:
    element:
      id: "situation-whisper"
- tapOn:
    id: "situation-whisper"
- scrollUntilVisible:
    element:
      id: "situation-hint"
- takeScreenshot: 10e_situation_whisper
- repeat:
    while:
      notVisible:
        id: "strength-auto"
    times: 15
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 80%
          duration: 400
- tapOn:
    id: "strength-auto"
- scrollUntilVisible:
    element:
      id: "start-enhance"
- takeScreenshot: 11_enhance_summary
- tapOn:
    id: "start-enhance"
- takeScreenshot: 12_enhance_running
- extendedWaitUntil:
    visible:
      id: "ab-original"
    timeout: 600000
- assertVisible:
    id: "keep-enhanced"
- takeScreenshot: 13_review_top
- tapOn:
    id: "ab-original"
- tapOn:
    id: "review-play"
- tapOn:
    id: "ab-enhanced"
- tapOn:
    id: "review-play"
- scrollUntilVisible:
    element: "Mains hum found at 50 Hz"
- takeScreenshot: 14_review_levels
- tapOn:
    id: "keep-enhanced"
- extendedWaitUntil:
    visible:
      id: "source-enhanced"
    timeout: 20000
- takeScreenshot: 15_player_enhanced
- tapOn:
    id: "source-original"
- tapOn:
    id: "source-enhanced"
