# Parallel transcription: a 90-second recording has several speech chunks, sent two at a time
# (the "[VC] transcribe ... paired chunks=N" log line). Own Maestro session; keeps the app's data,
# so the base model downloaded in main1b.yaml is used (or downloaded here).
# This flow only starts the transcription: a Maestro session longer than about 10 minutes loses
# its device server, so run-on-emulator.sh waits for the log line and then runs asr-pair-check.yaml.
appId: com.example.voiceclarity
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "import"
    timeout: 30000
- tapOn:
    id: "import"
- runFlow:
    file: pick.yaml
    env:
      FILE: talk_90s.wav
      SHOT: "80"
- extendedWaitUntil:
    visible:
      id: "rec-talk_90s"
    timeout: 60000
- tapOn:
    id: "rec-talk_90s"
- scrollUntilVisible:
    element:
      id: "transcript"
    timeout: 120000
- tapOn:
    id: "transcript"
- extendedWaitUntil:
    visible:
      id: "lang-ar"
    timeout: 120000
- tapOn:
    id: "lang-ar"
- tapOn:
    id: "model-base"
- scrollUntilVisible:
    element: ".*(Download \\(148 MB\\)|On device).*"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "download-model"
    commands:
      - tapOn:
          id: "download-model"
- extendedWaitUntil:
    visible: ".*On device.*"
    timeout: 480000
- scrollUntilVisible:
    element:
      id: "asr-parallel"
- takeScreenshot: 81_asr_parallel_setting
- scrollUntilVisible:
    element:
      id: "start-transcribe"
- tapOn:
    id: "start-transcribe"
